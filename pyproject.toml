[project]
name = "applicant-tracking-system"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-tailwind-cli>=4.8.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# prototypes/ are throwaway references (imports must follow django.setup()).
extend-exclude = ["*/migrations/*", "prototypes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "RUF"]
# RUF012 flags Django's normal class attributes (Meta.fields, ordering, list_display...).
ignore = ["RUF012"]
